name: pageturner-local
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pagetuner
      POSTGRES_USER: pagetuner
      POSTGRES_PASSWORD: ${PAGETUNER_DATABASE_PASSWORD:?Run scripts/local_stack.py init first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagetuner -d pagetuner"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
volumes:
  database:
